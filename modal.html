<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/modal.css" />
  </head>
  <body>
    <a href="./index.html">Back</a>
    <header></header>
    <main>
      <section class="hero">
        <!-- <button type="button" class="btn-open" data-modal-open>Click me</button> -->
      </section>
    </main>
    <footer></footer>
    <!-- Modal window -->
    <button class="btn-open" data-modal-open>Відкрити модалку</button>
    <div class="backdrop is-hidden" data-modal>
      <div class="modal">
        <button class="btn" data-modal-close>Закрити</button>
        <form class="form">
          <label class="label">
            <span>Name</span>
            <input
              type="text"
              required
              minlength="3"
              pattern="^[a-zA-Z]+\s[a-zA-Z]+$"
              title="Користувач повинен мати і'мя та прізвище розділене пробілом"
            />
          </label>
          <label class="label">
            <span>Password</span>
            <input
              class="password"
              type="password"
              required
              minlength="6"
              maxlength="12"
              placeholder="123456"
            />
          </label>
          <label class="label">
            <span>Email</span>
            <input
              class="email"
              type="email"
              required
              placeholder="exemple@mail.com"
            />
          </label>
          <label class="label">
            <span>Number</span>
            <input
              class="number"
              type="number"
              value="0"
              required
              min="1"
              max="10"
            />
          </label>
          <label>
            <span>Погоджуюсь з умовами обробки даних</span>
            <input class="checkbox" type="checkbox" />
          </label>

          <button type="submit">Send</button>
          <button type="submit" disabled>Send 2</button>
        </form>
      </div>
    </div>
    <script src="./js/modal.js"></script>
  </body>
</html>
